<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF4500;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background (Optional: can be transparent) -->
  <rect width="500" height="500" fill="white" rx="50" ry="50"/>

  <!-- Stylized V Shape -->
  <path d="M120 100 L250 400 L380 100 H300 L250 250 L200 100 H120 Z" fill="url(#grad1)"/>
  
  <!-- Digital Accent Nodes -->
  <circle cx="120" cy="100" r="15" fill="#333"/>
  <circle cx="380" cy="100" r="15" fill="#333"/>
  <circle cx="250" cy="400" r="15" fill="#333"/>
  
  <!-- Text -->
  <text x="50%" y="460" font-family="Arial, sans-serif" font-weight="bold" font-size="60" text-anchor="middle" fill="#333">VIT DIGITAL</text>
</svg>
